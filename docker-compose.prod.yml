# Production Docker Compose for StockIQ
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: stockiq
      POSTGRES_USER: stockiq
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockiq"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stockiq
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stockiq
    deploy:
      resources:
        limits:
          memory: 256M

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://stockiq:${DB_PASSWORD}@postgres:5432/stockiq
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-https://stockiq.app}
      PYTHON_SERVICE_URL: http://fastapi:8000
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL:-StockIQ <notifications@stockiq.app>}
    networks:
      - stockiq
    deploy:
      resources:
        limits:
          memory: 512M

  fastapi:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    restart: always
    networks:
      - stockiq
    deploy:
      resources:
        limits:
          memory: 1G

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - nextjs
    networks:
      - stockiq
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  pgdata:
  redisdata:

networks:
  stockiq:
    driver: bridge
