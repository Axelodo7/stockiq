services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockiq
      POSTGRES_USER: stockiq
      POSTGRES_PASSWORD: stockiq_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: npm run dev
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://stockiq:stockiq_dev_password@postgres:5432/stockiq
      NEXTAUTH_SECRET: dev-secret-change-in-production
      NEXTAUTH_URL: http://localhost:3000

  fastapi:
    build: ./python-service
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - ./python-service/app:/app/app
    ports:
      - "8000:8000"

volumes:
  pgdata:
